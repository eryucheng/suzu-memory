<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="498" viewBox="0 0 1120 498" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">Suzu Memory 工作方式</title><desc id="desc">记录经历：保留原话、发言者、接收者、空间、时间与来源，只写本地。后台整理：按长度分批，抽取事件与事实，分析十二类人物认识，追踪事件延续与状态变化。按需召回：多路检索，时间表达调整排序，展开原话与正反证据，按预算返回。底层提供本地 SQLite、审核台、备份恢复、按来源范围清理与只读模式。</desc>
<style>
:root{--bg:#faf8fe;--panel:#ffffff;--soft:#f1eaf9;--line:#e5dcef;--text:#30233f;--muted:#897899;--accent:#9365cb;--pink:#bf71ac;--blue:#777bc4;--edge:#c2a8db;--track:#efe8f7;--none:#cdbfdc}
@media(prefers-color-scheme:dark){:root{--bg:#120e1c;--panel:#1d162b;--soft:#2c203e;--line:#3a2b4d;--text:#f1eafa;--muted:#b5a0ca;--accent:#c39cf5;--pink:#e0a1ce;--blue:#a5acf1;--edge:#795496;--track:#261c36;--none:#6d5a85}}
.bg{fill:var(--bg);stroke:var(--line)}.panel{fill:var(--panel);stroke:var(--line)}.soft{fill:var(--soft)}.track{fill:var(--track)}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.none{fill:var(--none)}
.dash{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--accent)}
.num{font-variant-numeric:tabular-nums}.s1{stop-color:var(--accent)}.s2{stop-color:var(--pink)}
</style>
<defs><linearGradient id="bar" x1="0" x2="1"><stop class="s1"/><stop offset="1" class="s2"/></linearGradient></defs>
<rect x="1" y="1" width="1118" height="496" rx="22" class="bg"/><text x="36" y="36" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">HOW IT WORKS / RECORD · ORGANIZE · RECALL</text><text x="36" y="77" font-size="32" class="text" font-weight="600">先记下原话，再慢慢整理，需要时带着证据想起来。</text><text x="36" y="108" font-size="16" class="muted">写入只落本地；整理在后台按长度分批进行；召回在预算内返回记忆与原话。</text><rect x="36" y="140" width="320" height="250" rx="18" class="panel"/><text x="60" y="178" font-size="12" class="accent num" font-weight="700" letter-spacing="1.5">01</text><text x="92" y="179" font-size="22" class="text" font-weight="600">记录经历</text><text x="60" y="206" font-size="12.5" class="muted">appendEvents · afterReply</text><path d="M60 224H332" class="dash"/><circle cx="66" cy="253" r="3.5" class="dot"/><text x="80" y="258" font-size="15" class="text">保留原话与发言者、接收者</text><circle cx="66" cy="287" r="3.5" class="dot"/><text x="80" y="292" font-size="15" class="text">记录互动空间、时间与来源</text><circle cx="66" cy="321" r="3.5" class="dot"/><text x="80" y="326" font-size="15" class="text">只写本地 SQLite，不调用模型</text><circle cx="66" cy="355" r="3.5" class="dot"/><text x="80" y="360" font-size="15" class="text">来源范围与提交位置可校验</text><path d="M364 265H392m-6 -6 6 6 -6 6" class="edge"/><rect x="400" y="140" width="320" height="250" rx="18" class="soft"/><text x="424" y="178" font-size="12" class="accent num" font-weight="700" letter-spacing="1.5">02</text><text x="456" y="179" font-size="22" class="text" font-weight="600">后台整理</text><text x="424" y="206" font-size="12.5" class="muted">runMaintenance · onIdle</text><path d="M424 224H696" class="dash"/><circle cx="430" cy="253" r="3.5" class="dot"/><text x="444" y="258" font-size="15" class="text">按长度分批，带前后文参考</text><circle cx="430" cy="287" r="3.5" class="dot"/><text x="444" y="292" font-size="15" class="text">抽取事件、事实与原话证据</text><circle cx="430" cy="321" r="3.5" class="dot"/><text x="444" y="326" font-size="15" class="text">分析十二类人物认识</text><circle cx="430" cy="355" r="3.5" class="dot"/><text x="444" y="360" font-size="15" class="text">追踪事件延续与状态变化</text><path d="M728 265H756m-6 -6 6 6 -6 6" class="edge"/><rect x="764" y="140" width="320" height="250" rx="18" class="panel"/><text x="788" y="178" font-size="12" class="accent num" font-weight="700" letter-spacing="1.5">03</text><text x="820" y="179" font-size="22" class="text" font-weight="600">按需召回</text><text x="788" y="206" font-size="12.5" class="muted">search · beforeReply · 工具</text><path d="M788 224H1060" class="dash"/><circle cx="794" cy="253" r="3.5" class="dot"/><text x="808" y="258" font-size="15" class="text">词法、BM25、实体与向量</text><circle cx="794" cy="287" r="3.5" class="dot"/><text x="808" y="292" font-size="15" class="text">中英文时间表达调整排序</text><circle cx="794" cy="321" r="3.5" class="dot"/><text x="808" y="326" font-size="15" class="text">沿关联展开原话与正反证据</text><circle cx="794" cy="355" r="3.5" class="dot"/><text x="808" y="360" font-size="15" class="text">按条数与字符预算返回</text><rect x="36" y="414" width="1048" height="52" rx="14" class="soft"/><text x="140.8" y="446" font-size="14.5" class="accent" text-anchor="middle" font-weight="600">本地 SQLite</text><text x="350.4" y="446" font-size="14.5" class="muted" text-anchor="middle" font-weight="500">审核台与人工复核</text><text x="560" y="446" font-size="14.5" class="muted" text-anchor="middle" font-weight="500">备份与恢复</text><text x="769.5999999999999" y="446" font-size="14.5" class="muted" text-anchor="middle" font-weight="500">按来源范围物理清理</text><text x="979.1999999999999" y="446" font-size="14.5" class="muted" text-anchor="middle" font-weight="500">只读模式</text>
</svg>
