<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="546" viewBox="0 0 1120 546" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">LoCoMo 作答输入与对话长度</title><desc id="desc">10 组对话的长度从 52,707 到 106,835 字符。完整对话组每题输入从 12,990 增至 24,533 token，与长度的相关系数为 0.99；Suzu Memory 每题输入保持在 4,033–4,664 token，相关系数为 0.09。</desc>
<style>
:root{--bg:#faf8fe;--panel:#ffffff;--soft:#f1eaf9;--line:#e5dcef;--text:#30233f;--muted:#897899;--accent:#9365cb;--pink:#bf71ac;--blue:#777bc4;--edge:#c2a8db;--track:#efe8f7;--none:#cdbfdc}
@media(prefers-color-scheme:dark){:root{--bg:#120e1c;--panel:#1d162b;--soft:#2c203e;--line:#3a2b4d;--text:#f1eafa;--muted:#b5a0ca;--accent:#c39cf5;--pink:#e0a1ce;--blue:#a5acf1;--edge:#795496;--track:#261c36;--none:#6d5a85}}
.bg{fill:var(--bg);stroke:var(--line)}.panel{fill:var(--panel);stroke:var(--line)}.soft{fill:var(--soft)}.track{fill:var(--track)}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.none{fill:var(--none)}
.dash{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--accent)}
.rule{stroke:var(--line);stroke-width:1}.trend-full{stroke:var(--blue);stroke-width:2;stroke-dasharray:6 5;opacity:.7}.band{fill:var(--accent);fill-opacity:.14}.pt-full{fill:var(--blue)}.pt-memory{fill:var(--accent);stroke:var(--bg);stroke-width:1.5}
.num{font-variant-numeric:tabular-nums}.s1{stop-color:var(--accent)}.s2{stop-color:var(--pink)}
</style>
<defs><linearGradient id="bar" x1="0" x2="1"><stop class="s1"/><stop offset="1" class="s2"/></linearGradient></defs>
<rect x="1" y="1" width="1118" height="544" rx="22" class="bg"/><text x="36" y="36" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">INPUT VS. DIALOGUE LENGTH · 10 CONVERSATIONS</text><text x="36" y="77" font-size="32" class="text" font-weight="600">对话变长，记忆组的输入不跟着涨。</text><text x="36" y="108" font-size="16" class="muted">每个点是一组对话。完整对话的输入随对话长度增长，记忆组的输入由检索预算决定。</text><path d="M104 440H940" class="rule"/><text x="94" y="444" font-size="12" class="muted num" text-anchor="end">0</text><path d="M104 391.6666666666667H940" class="dash"/><text x="94" y="395.6666666666667" font-size="12" class="muted num" text-anchor="end">5K</text><path d="M104 343.3333333333333H940" class="dash"/><text x="94" y="347.3333333333333" font-size="12" class="muted num" text-anchor="end">10K</text><path d="M104 295H940" class="dash"/><text x="94" y="299" font-size="12" class="muted num" text-anchor="end">15K</text><path d="M104 246.66666666666666H940" class="dash"/><text x="94" y="250.66666666666666" font-size="12" class="muted num" text-anchor="end">20K</text><path d="M104 198.33333333333334H940" class="dash"/><text x="94" y="202.33333333333334" font-size="12" class="muted num" text-anchor="end">25K</text><path d="M104 150H940" class="dash"/><text x="94" y="154" font-size="12" class="muted num" text-anchor="end">30K</text><text x="104" y="460" font-size="12" class="muted num" text-anchor="middle">40K</text><text x="313" y="460" font-size="12" class="muted num" text-anchor="middle">60K</text><text x="522" y="460" font-size="12" class="muted num" text-anchor="middle">80K</text><text x="731" y="460" font-size="12" class="muted num" text-anchor="middle">100K</text><text x="940" y="460" font-size="12" class="muted num" text-anchor="middle">120K</text><text x="522" y="482" font-size="12.5" class="muted" text-anchor="middle">对话长度（字符）</text><text x="94" y="134" font-size="12.5" class="muted" text-anchor="start">每题作答输入（token）</text><path d="M195.0 321.7L844.2 188.7" class="trend-full"/><rect x="195.0" y="394.9" width="649.2" height="6.1" rx="4" class="band"/><circle cx="236.8" cy="314.4" r="6" class="pt-full"/><circle cx="444.7" cy="275.9" r="6" class="pt-full"/><circle cx="462.7" cy="264.0" r="6" class="pt-full"/><circle cx="603.7" cy="233.3" r="6" class="pt-full"/><circle cx="652.8" cy="223.9" r="6" class="pt-full"/><circle cx="690.8" cy="221.6" r="6" class="pt-full"/><circle cx="699.0" cy="217.4" r="6" class="pt-full"/><circle cx="735.8" cy="206.9" r="6" class="pt-full"/><circle cx="790.4" cy="202.4" r="6" class="pt-full"/><circle cx="802.4" cy="202.8" r="6" class="pt-full"/><circle cx="236.8" cy="400.4" r="6" class="pt-memory"/><circle cx="444.7" cy="398.2" r="6" class="pt-memory"/><circle cx="462.7" cy="396.1" r="6" class="pt-memory"/><circle cx="603.7" cy="395.0" r="6" class="pt-memory"/><circle cx="652.8" cy="397.9" r="6" class="pt-memory"/><circle cx="690.8" cy="398.8" r="6" class="pt-memory"/><circle cx="699.0" cy="397.7" r="6" class="pt-memory"/><circle cx="735.8" cy="394.9" r="6" class="pt-memory"/><circle cx="790.4" cy="398.6" r="6" class="pt-memory"/><circle cx="802.4" cy="401.0" r="6" class="pt-memory"/><text x="236.78815" y="300.43322222222224" font-size="12.5" class="blue num" text-anchor="middle" font-weight="600">12,990</text><text x="802.42575" y="188.84747587719295" font-size="12.5" class="blue num" text-anchor="middle" font-weight="600">24,533</text><text x="958" y="190.67187187354534" font-size="15" class="blue" font-weight="600">完整对话</text><text x="958" y="210.67187187354534" font-size="12.5" class="muted num">相关系数 0.99</text><text x="958" y="391.850774207905" font-size="15" class="accent" font-weight="600">Suzu Memory</text><text x="958" y="411.850774207905" font-size="12.5" class="muted num">4,033–4,664 token</text><text x="958" y="429.850774207905" font-size="12.5" class="muted num">相关系数 0.09</text><text x="36" y="516" font-size="12.5" class="muted">记忆组每次检索最多返回 10 条记忆、10,976 字符，每题最多检索 6 次；单题输入取决于模型检索了几次，而不是对话有多长。</text>
</svg>
