<svg xmlns="http://www.w3.org/2000/svg" width="480" height="908" viewBox="0 0 480 908" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">Suzu Memory 工作方式</title><desc id="desc">记录经历：保留原话、发言者、接收者、空间、时间与来源，只写本地。后台整理：按长度分批，抽取事件与事实，分析十二类人物认识，追踪事件延续与状态变化。按需召回：多路检索，时间表达调整排序，展开原话与正反证据，按预算返回。底层提供本地 SQLite、审核台、备份恢复、按来源范围清理与只读模式。</desc>
<style>
:root{--bg:#faf8fe;--panel:#ffffff;--soft:#f1eaf9;--line:#e5dcef;--text:#30233f;--muted:#897899;--accent:#9365cb;--pink:#bf71ac;--blue:#777bc4;--edge:#c2a8db;--track:#efe8f7;--none:#cdbfdc}
@media(prefers-color-scheme:dark){:root{--bg:#120e1c;--panel:#1d162b;--soft:#2c203e;--line:#3a2b4d;--text:#f1eafa;--muted:#b5a0ca;--accent:#c39cf5;--pink:#e0a1ce;--blue:#a5acf1;--edge:#795496;--track:#261c36;--none:#6d5a85}}
.bg{fill:var(--bg);stroke:var(--line)}.panel{fill:var(--panel);stroke:var(--line)}.soft{fill:var(--soft)}.track{fill:var(--track)}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.none{fill:var(--none)}
.dash{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--accent)}
.num{font-variant-numeric:tabular-nums}.s1{stop-color:var(--accent)}.s2{stop-color:var(--pink)}
</style>
<defs><linearGradient id="bar" x1="0" x2="1"><stop class="s1"/><stop offset="1" class="s2"/></linearGradient></defs>
<rect x="1" y="1" width="478" height="906" rx="22" class="bg"/><text x="28" y="36" font-size="10" class="muted" font-weight="600" letter-spacing="1.6">HOW IT WORKS</text><text x="28" y="72" font-size="24" class="text" font-weight="600">先记下原话，再慢慢整理，</text><text x="28" y="104" font-size="24" class="text" font-weight="600">需要时带着证据想起来。</text><rect x="28" y="132" width="424" height="196" rx="16" class="panel"/><text x="48" y="166" font-size="11.5" class="accent num" font-weight="700" letter-spacing="1.4">01</text><text x="78" y="167" font-size="19" class="text" font-weight="600">记录经历</text><text x="48" y="192" font-size="12" class="muted">appendEvents · afterReply</text><circle cx="52" cy="221" r="3" class="dot"/><text x="64" y="226" font-size="14" class="text">保留原话与发言者、接收者</text><circle cx="52" cy="249" r="3" class="dot"/><text x="64" y="254" font-size="14" class="text">记录互动空间、时间与来源</text><circle cx="52" cy="277" r="3" class="dot"/><text x="64" y="282" font-size="14" class="text">只写本地 SQLite，不调用模型</text><circle cx="52" cy="305" r="3" class="dot"/><text x="64" y="310" font-size="14" class="text">来源范围与提交位置可校验</text><path d="M240 334V354m-6 -6 6 6 6 -6" class="edge"/><rect x="28" y="360" width="424" height="196" rx="16" class="soft"/><text x="48" y="394" font-size="11.5" class="accent num" font-weight="700" letter-spacing="1.4">02</text><text x="78" y="395" font-size="19" class="text" font-weight="600">后台整理</text><text x="48" y="420" font-size="12" class="muted">runMaintenance · onIdle</text><circle cx="52" cy="449" r="3" class="dot"/><text x="64" y="454" font-size="14" class="text">按长度分批，带前后文参考</text><circle cx="52" cy="477" r="3" class="dot"/><text x="64" y="482" font-size="14" class="text">抽取事件、事实与原话证据</text><circle cx="52" cy="505" r="3" class="dot"/><text x="64" y="510" font-size="14" class="text">分析十二类人物认识</text><circle cx="52" cy="533" r="3" class="dot"/><text x="64" y="538" font-size="14" class="text">追踪事件延续与状态变化</text><path d="M240 562V582m-6 -6 6 6 6 -6" class="edge"/><rect x="28" y="588" width="424" height="196" rx="16" class="panel"/><text x="48" y="622" font-size="11.5" class="accent num" font-weight="700" letter-spacing="1.4">03</text><text x="78" y="623" font-size="19" class="text" font-weight="600">按需召回</text><text x="48" y="648" font-size="12" class="muted">search · beforeReply · 工具</text><circle cx="52" cy="677" r="3" class="dot"/><text x="64" y="682" font-size="14" class="text">词法、BM25、实体与向量</text><circle cx="52" cy="705" r="3" class="dot"/><text x="64" y="710" font-size="14" class="text">中英文时间表达调整排序</text><circle cx="52" cy="733" r="3" class="dot"/><text x="64" y="738" font-size="14" class="text">沿关联展开原话与正反证据</text><circle cx="52" cy="761" r="3" class="dot"/><text x="64" y="766" font-size="14" class="text">按条数与字符预算返回</text><rect x="28" y="804" width="424" height="76" rx="14" class="soft"/><text x="98.66666666666667" y="834" font-size="13" class="accent" text-anchor="middle" font-weight="600">本地 SQLite</text><text x="240" y="834" font-size="13" class="muted" text-anchor="middle" font-weight="500">审核台与人工复核</text><text x="381.33333333333337" y="834" font-size="13" class="muted" text-anchor="middle" font-weight="500">备份与恢复</text><text x="134" y="860" font-size="13" class="muted" text-anchor="middle" font-weight="500">按来源范围物理清理</text><text x="346" y="860" font-size="13" class="muted" text-anchor="middle" font-weight="500">只读模式</text>
</svg>
