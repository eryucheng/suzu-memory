<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1104" viewBox="0 0 480 1104" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">记忆的连续性与证据</title><desc id="desc">状态更新保留历史，认识可回到支持和反对证据。记录实际人物与来源。可配置自然衰减和召回再激活，调整排序而保留内容。</desc>
<style>
:root{--bg:#faf8fe;--panel:#ffffff;--soft:#f1eaf9;--line:#e5dcef;--text:#30233f;--muted:#897899;--accent:#9365cb;--pink:#bf71ac;--blue:#777bc4;--edge:#c2a8db}
@media(prefers-color-scheme:dark){:root{--bg:#120e1c;--panel:#1d162b;--soft:#2c203e;--line:#3a2b4d;--text:#f1eafa;--muted:#b5a0ca;--accent:#c39cf5;--pink:#e0a1ce;--blue:#a5acf1;--edge:#795496}}
.bg{fill:var(--bg);stroke:var(--line)}.panel{fill:var(--panel);stroke:var(--line)}.soft{fill:var(--soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.pink{fill:var(--pink)}.blue{fill:var(--blue)}.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.icon{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect x="1" y="1" width="478" height="1102" rx="22" class="bg" /><text x="28" y="36" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">MEMORY / CONTINUITY &amp; EVIDENCE</text><text x="28" y="77" font-size="26" class="text" font-weight="600" >保留来处，才能理解变化。</text><text x="28" y="108" font-size="16" class="muted" font-weight="400" >让经历、认识与后续交流保持连接。</text><rect x="24" y="136" width="432" height="214" rx="18" class="panel" /><text x="46" y="165" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">01 / EVOLVING STATES</text><text x="46" y="202" font-size="22" class="text" font-weight="600" >认识会更新，经历仍有来处。</text><rect x="46.0" y="230" width="117.33333333333334" height="48" rx="10" class="soft" /><text x="59.0" y="261" font-size="17" class="accent" font-weight="600" >旧认识</text><text x="51.0" y="306" font-size="13" class="muted" font-weight="400" >历史保留</text><path d="M166.33333333333334 254h6m-3-3 3 3-3 3" class="edge" /><rect x="175.33333333333334" y="230" width="117.33333333333334" height="48" rx="10" class="soft" /><text x="188.33333333333334" y="261" font-size="17" class="accent" font-weight="600" >新证据</text><text x="180.33333333333334" y="306" font-size="13" class="muted" font-weight="400" >补充与纠正</text><path d="M295.6666666666667 254h6m-3-3 3 3-3 3" class="edge" /><rect x="304.6666666666667" y="230" width="117.33333333333334" height="48" rx="10" class="soft" /><text x="317.6666666666667" y="261" font-size="17" class="accent" font-weight="600" >当前认识</text><text x="309.6666666666667" y="306" font-size="13" class="muted" font-weight="400" >有效状态</text><rect x="24" y="366" width="432" height="214" rx="18" class="panel" /><text x="46" y="395" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">02 / TRACEABLE EVIDENCE</text><text x="46" y="432" font-size="22" class="text" font-weight="600" >结论可以回到原话与证据。</text><rect x="178.0" y="454" width="124" height="42" rx="10" class="soft" /><text x="240.0" y="481" font-size="17" class="text" font-weight="600" text-anchor="middle">人物认识</text><path d="M240.0 496v15H109v16M240.0 511H371v16" class="edge" /><rect x="54" y="531" width="110" height="37" rx="9" class="soft" /><text x="109" y="555" font-size="15" class="accent" font-weight="600" text-anchor="middle">支持证据</text><rect x="316" y="531" width="110" height="37" rx="9" class="soft" /><text x="371" y="555" font-size="15" class="pink" font-weight="600" text-anchor="middle">反对证据</text><rect x="24" y="596" width="432" height="214" rx="18" class="panel" /><text x="46" y="625" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">03 / PEOPLE &amp; SOURCES</text><text x="46" y="661" font-size="20" class="text" font-weight="600" >记清谁说过，也记清来自哪里。</text><circle cx="82.0" cy="708" r="24" class="soft"/><text x="82.0" y="716" font-size="21" class="accent" font-weight="600" text-anchor="middle">A</text><text x="82.0" y="757" font-size="13" class="muted" font-weight="500" text-anchor="middle">发言者</text><circle cx="206.0" cy="708" r="24" class="soft"/><text x="206.0" y="716" font-size="21" class="accent" font-weight="600" text-anchor="middle">B</text><text x="206.0" y="757" font-size="13" class="muted" font-weight="500" text-anchor="middle">接收 Agent</text><circle cx="330.0" cy="708" r="24" class="soft"/><text x="330.0" y="716" font-size="21" class="accent" font-weight="600" text-anchor="middle">#</text><text x="330.0" y="757" font-size="13" class="muted" font-weight="500" text-anchor="middle">来源空间</text><rect x="24" y="826" width="432" height="214" rx="18" class="panel" /><text x="46" y="855" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">04 / ACCESSIBILITY</text><text x="46" y="891" font-size="20" class="text" font-weight="600" >想起有轻重，原始内容仍保留。</text><text x="46" y="921" font-size="12" class="muted" font-weight="400" >自然衰减与召回再激活可配置，分别参与排序。</text><path d="M52 968H428" class="edge" stroke-opacity=".4"/><path d="M52 942C147.04000000000002 978 224.8 979 428 981" class="edge" style="stroke:var(--accent);stroke-width:2.2"/><path d="M52 989Q203.2 989 263.68 950Q311.2 921 428 971" class="edge" style="stroke:var(--pink);stroke-width:2.2"/><text x="52" y="1014" font-size="12" class="accent" font-weight="600" >衰减</text><text x="106" y="1014" font-size="12" class="pink" font-weight="600" >再激活</text><text x="428" y="1014" font-size="11" class="muted" font-weight="400" text-anchor="end">机制示意</text><text x="28" y="1080" font-size="12" class="muted" font-weight="400" >来源范围 · 激活去重 · 网络快照 · 审核与恢复</text>
</svg>
