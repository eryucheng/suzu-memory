<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1222" viewBox="0 0 480 1222" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">十二类人物认识</title><desc id="desc">身份与生平、观念、偏好、习惯、应对倾向、价值、目标、能力、关系、情绪联结、自我认识、现实条件。每类认识保留主体、范围、时间与来源。</desc>
<style>
:root{--bg:#faf8fe;--panel:#ffffff;--soft:#f1eaf9;--line:#e5dcef;--text:#30233f;--muted:#897899;--accent:#9365cb;--pink:#bf71ac;--blue:#777bc4;--edge:#c2a8db}
@media(prefers-color-scheme:dark){:root{--bg:#120e1c;--panel:#1d162b;--soft:#2c203e;--line:#3a2b4d;--text:#f1eafa;--muted:#b5a0ca;--accent:#c39cf5;--pink:#e0a1ce;--blue:#a5acf1;--edge:#795496}}
.bg{fill:var(--bg);stroke:var(--line)}.panel{fill:var(--panel);stroke:var(--line)}.soft{fill:var(--soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.pink{fill:var(--pink)}.blue{fill:var(--blue)}.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.icon{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect x="1" y="1" width="478" height="1220" rx="22" class="bg" /><text x="28" y="36" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">PERSON UNDERSTANDING / 12 DIMENSIONS</text><text x="28" y="77" font-size="25" class="text" font-weight="600" >认识一个人，有十二个维度。</text><text x="28" y="108" font-size="16" class="muted" font-weight="400" >从一次经历，到逐渐形成的认识。</text><rect x="24" y="140" width="208" height="158" rx="14" class="panel" /><rect x="40" y="154" width="34" height="34" rx="9" class="soft" /><g transform="translate(45 159) scale(0.98)" class="icon"><circle cx="12" cy="7" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></g><text x="197" y="175" font-size="11" class="muted" font-weight="600" >01</text><text x="40" y="218" font-size="18" class="text" font-weight="600" >身份与生平</text><text x="40" y="248" font-size="13" class="muted" font-weight="400" >姓名、身份与经历</text><text x="40" y="272" font-size="13" class="muted" font-weight="400" >一个人的背景与来处</text><rect x="248" y="140" width="208" height="158" rx="14" class="panel" /><rect x="264" y="154" width="34" height="34" rx="9" class="soft" /><g transform="translate(269 159) scale(0.98)" class="icon"><path d="M20 15.5a3.5 3.5 0 0 1-3.5 3.5H10l-4.5 3v-3.3A3.5 3.5 0 0 1 3 15.5v-8A3.5 3.5 0 0 1 6.5 4h10A3.5 3.5 0 0 1 20 7.5Z"/><path d="M7.5 10h8M7.5 13h5"/></g><text x="421" y="175" font-size="11" class="muted" font-weight="600" >02</text><text x="264" y="218" font-size="18" class="text" font-weight="600" >观念与看法</text><text x="264" y="248" font-size="13" class="muted" font-weight="400" >怎样理解人物与事物</text><text x="264" y="272" font-size="13" class="muted" font-weight="400" >保留观点及其变化</text><rect x="24" y="314" width="208" height="158" rx="14" class="panel" /><rect x="40" y="328" width="34" height="34" rx="9" class="soft" /><g transform="translate(45 333) scale(0.98)" class="icon"><path d="M12 20s-7.1-4.4-8.6-8.6C2.2 8.1 4.1 5.5 7.1 5.5c1.8 0 3.5.9 4.9 2.6 1.4-1.7 3.1-2.6 4.9-2.6 3 0 4.9 2.6 3.7 5.9C19.1 15.6 12 20 12 20Z"/></g><text x="197" y="349" font-size="11" class="muted" font-weight="600" >03</text><text x="40" y="392" font-size="18" class="text" font-weight="600" >喜好与厌恶</text><text x="40" y="422" font-size="13" class="muted" font-weight="400" >可选择时更愿意怎样</text><text x="40" y="446" font-size="13" class="muted" font-weight="400" >区分选择与现实约束</text><rect x="248" y="314" width="208" height="158" rx="14" class="panel" /><rect x="264" y="328" width="34" height="34" rx="9" class="soft" /><g transform="translate(269 333) scale(0.98)" class="icon"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h3M8 17h5"/></g><text x="421" y="349" font-size="11" class="muted" font-weight="600" >04</text><text x="264" y="392" font-size="18" class="text" font-weight="600" >习惯与生活规律</text><text x="264" y="422" font-size="13" class="muted" font-weight="400" >什么条件下经常做什么</text><text x="264" y="446" font-size="13" class="muted" font-weight="400" >保留场景与时间范围</text><rect x="24" y="488" width="208" height="158" rx="14" class="panel" /><rect x="40" y="502" width="34" height="34" rx="9" class="soft" /><g transform="translate(45 507) scale(0.98)" class="icon"><path d="M2 12h3l3-7 4 14 4-12 3 5h3"/></g><text x="197" y="523" font-size="11" class="muted" font-weight="600" >05</text><text x="40" y="566" font-size="18" class="text" font-weight="600" >气质与应对倾向</text><text x="40" y="596" font-size="13" class="muted" font-weight="400" >怎样交流、选择与应对</text><text x="40" y="620" font-size="13" class="muted" font-weight="400" >依据跨情境的表现</text><rect x="248" y="488" width="208" height="158" rx="14" class="panel" /><rect x="264" y="502" width="34" height="34" rx="9" class="soft" /><g transform="translate(269 507) scale(0.98)" class="icon"><path d="M12 3v18M5 21h14M4 6h16M5 6l-3 8h6L5 6Zm14 0-3 8h6l-3-8Z"/></g><text x="421" y="523" font-size="11" class="muted" font-weight="600" >06</text><text x="264" y="566" font-size="18" class="text" font-weight="600" >价值与优先级</text><text x="264" y="596" font-size="13" class="muted" font-weight="400" >在真实取舍中保护什么</text><text x="264" y="620" font-size="13" class="muted" font-weight="400" >连接原则与行动证据</text><rect x="24" y="662" width="208" height="158" rx="14" class="panel" /><rect x="40" y="676" width="34" height="34" rx="9" class="soft" /><g transform="translate(45 681) scale(0.98)" class="icon"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></g><text x="197" y="697" font-size="11" class="muted" font-weight="600" >07</text><text x="40" y="740" font-size="18" class="text" font-weight="600" >目标与未完事项</text><text x="40" y="770" font-size="13" class="muted" font-weight="400" >正在追求与尚待继续</text><text x="40" y="794" font-size="13" class="muted" font-weight="400" >记录计划、承诺与进展</text><rect x="248" y="662" width="208" height="158" rx="14" class="panel" /><rect x="264" y="676" width="34" height="34" rx="9" class="soft" /><g transform="translate(269 681) scale(0.98)" class="icon"><path d="m12 3 1.4 5.6L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.4Z"/><path d="m19 16 .6 2.4L22 19l-2.4.6L19 22l-.6-2.4L16 19l2.4-.6Z"/></g><text x="421" y="697" font-size="11" class="muted" font-weight="600" >08</text><text x="264" y="740" font-size="18" class="text" font-weight="600" >能力与熟练度</text><text x="264" y="770" font-size="13" class="muted" font-weight="400" >会做什么，表现如何</text><text x="264" y="794" font-size="13" class="muted" font-weight="400" >保留任务与依赖条件</text><rect x="24" y="836" width="208" height="158" rx="14" class="panel" /><rect x="40" y="850" width="34" height="34" rx="9" class="soft" /><g transform="translate(45 855) scale(0.98)" class="icon"><path d="m10 14 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 10a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-1 1"/></g><text x="197" y="871" font-size="11" class="muted" font-weight="600" >09</text><text x="40" y="914" font-size="18" class="text" font-weight="600" >关系、角色与边界</text><text x="40" y="944" font-size="13" class="muted" font-weight="400" >与谁形成怎样的关系</text><text x="40" y="968" font-size="13" class="muted" font-weight="400" >保留方向、约定与期待</text><rect x="248" y="836" width="208" height="158" rx="14" class="panel" /><rect x="264" y="850" width="34" height="34" rx="9" class="soft" /><g transform="translate(269 855) scale(0.98)" class="icon"><circle cx="12" cy="12" r="5"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></g><text x="421" y="871" font-size="11" class="muted" font-weight="600" >10</text><text x="264" y="914" font-size="18" class="text" font-weight="600" >情绪联结</text><text x="264" y="944" font-size="13" class="muted" font-weight="400" >什么容易引出何种感受</text><text x="264" y="968" font-size="13" class="muted" font-weight="400" >连接触发情境与经历</text><rect x="24" y="1010" width="208" height="158" rx="14" class="panel" /><rect x="40" y="1024" width="34" height="34" rx="9" class="soft" /><g transform="translate(45 1029) scale(0.98)" class="icon"><circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5 5-3Z"/></g><text x="197" y="1045" font-size="11" class="muted" font-weight="600" >11</text><text x="40" y="1088" font-size="18" class="text" font-weight="600" >自我认识</text><text x="40" y="1118" font-size="13" class="muted" font-weight="400" >当事人怎样理解自己</text><text x="40" y="1142" font-size="13" class="muted" font-weight="400" >保留自述与关键转折</text><rect x="248" y="1010" width="208" height="158" rx="14" class="panel" /><rect x="264" y="1024" width="34" height="34" rx="9" class="soft" /><g transform="translate(269 1029) scale(0.98)" class="icon"><path d="m3 10 9-7 9 7v11H3V10Z"/><path d="M9 21v-8h6v8"/></g><text x="421" y="1045" font-size="11" class="muted" font-weight="600" >12</text><text x="264" y="1088" font-size="18" class="text" font-weight="600" >现实条件与约束</text><text x="264" y="1118" font-size="13" class="muted" font-weight="400" >什么正在影响当前行为</text><text x="264" y="1142" font-size="13" class="muted" font-weight="400" >保留环境与有效期限</text><text x="28" y="1192" font-size="14" class="accent" font-weight="500" >主体 · 适用范围 · 时间 · 来源证据</text>
