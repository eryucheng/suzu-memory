<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="634" viewBox="0 0 1120 634" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">记忆的连续性与证据</title><desc id="desc">状态更新保留历史，认识可回到支持和反对证据。记录实际人物与来源。可配置自然衰减和召回再激活，调整排序而保留内容。</desc>
<style>
:root{--bg:#faf8fe;--panel:#ffffff;--soft:#f1eaf9;--line:#e5dcef;--text:#30233f;--muted:#897899;--accent:#9365cb;--pink:#bf71ac;--blue:#777bc4;--edge:#c2a8db}
@media(prefers-color-scheme:dark){:root{--bg:#120e1c;--panel:#1d162b;--soft:#2c203e;--line:#3a2b4d;--text:#f1eafa;--muted:#b5a0ca;--accent:#c39cf5;--pink:#e0a1ce;--blue:#a5acf1;--edge:#795496}}
.bg{fill:var(--bg);stroke:var(--line)}.panel{fill:var(--panel);stroke:var(--line)}.soft{fill:var(--soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.pink{fill:var(--pink)}.blue{fill:var(--blue)}.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.icon{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect x="1" y="1" width="1118" height="632" rx="22" class="bg" /><text x="36" y="36" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">MEMORY / CONTINUITY &amp; EVIDENCE</text><text x="36" y="77" font-size="32" class="text" font-weight="600" >保留来处，才能理解变化。</text><text x="36" y="108" font-size="16" class="muted" font-weight="400" >让经历、认识与后续交流保持连接。</text><rect x="24" y="136" width="620" height="214" rx="18" class="panel" /><text x="46" y="165" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">01 / EVOLVING STATES</text><text x="46" y="202" font-size="25" class="text" font-weight="600" >认识会更新，经历仍有来处。</text><rect x="46.0" y="230" width="180.0" height="48" rx="10" class="soft" /><text x="59.0" y="261" font-size="17" class="accent" font-weight="600" >旧认识</text><text x="51.0" y="306" font-size="13" class="muted" font-weight="400" >历史保留</text><path d="M229.0 254h6m-3-3 3 3-3 3" class="edge" /><rect x="238.0" y="230" width="180.0" height="48" rx="10" class="soft" /><text x="251.0" y="261" font-size="17" class="accent" font-weight="600" >新证据</text><text x="243.0" y="306" font-size="13" class="muted" font-weight="400" >补充与纠正</text><path d="M421.0 254h6m-3-3 3 3-3 3" class="edge" /><rect x="430.0" y="230" width="180.0" height="48" rx="10" class="soft" /><text x="443.0" y="261" font-size="17" class="accent" font-weight="600" >当前认识</text><text x="435.0" y="306" font-size="13" class="muted" font-weight="400" >有效状态</text><rect x="664" y="136" width="432" height="214" rx="18" class="panel" /><text x="686" y="165" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">02 / TRACEABLE EVIDENCE</text><text x="686" y="202" font-size="22" class="text" font-weight="600" >结论可以回到原话与证据。</text><rect x="818.0" y="224" width="124" height="42" rx="10" class="soft" /><text x="880.0" y="251" font-size="17" class="text" font-weight="600" text-anchor="middle">人物认识</text><path d="M880.0 266v15H749v16M880.0 281H1011v16" class="edge" /><rect x="694" y="301" width="110" height="37" rx="9" class="soft" /><text x="749" y="325" font-size="15" class="accent" font-weight="600" text-anchor="middle">支持证据</text><rect x="956" y="301" width="110" height="37" rx="9" class="soft" /><text x="1011" y="325" font-size="15" class="pink" font-weight="600" text-anchor="middle">反对证据</text><rect x="24" y="370" width="432" height="214" rx="18" class="panel" /><text x="46" y="399" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">03 / PEOPLE &amp; SOURCES</text><text x="46" y="435" font-size="20" class="text" font-weight="600" >记清谁说过，也记清来自哪里。</text><circle cx="82.0" cy="482" r="24" class="soft"/><text x="82.0" y="490" font-size="21" class="accent" font-weight="600" text-anchor="middle">A</text><text x="82.0" y="531" font-size="13" class="muted" font-weight="500" text-anchor="middle">发言者</text><circle cx="206.0" cy="482" r="24" class="soft"/><text x="206.0" y="490" font-size="21" class="accent" font-weight="600" text-anchor="middle">B</text><text x="206.0" y="531" font-size="13" class="muted" font-weight="500" text-anchor="middle">接收 Agent</text><circle cx="330.0" cy="482" r="24" class="soft"/><text x="330.0" y="490" font-size="21" class="accent" font-weight="600" text-anchor="middle">#</text><text x="330.0" y="531" font-size="13" class="muted" font-weight="500" text-anchor="middle">来源空间</text><rect x="476" y="370" width="620" height="214" rx="18" class="panel" /><text x="498" y="399" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">04 / ACCESSIBILITY</text><text x="498" y="435" font-size="25" class="text" font-weight="600" >想起有轻重，原始内容仍保留。</text><text x="498" y="465" font-size="14" class="muted" font-weight="400" >自然衰减与召回再激活可配置，分别参与排序。</text><path d="M504 512H1068" class="edge" stroke-opacity=".4"/><path d="M504 486C640.4 522 752.0 523 1068 525" class="edge" style="stroke:var(--accent);stroke-width:2.2"/><path d="M504 533Q721.0 533 807.8 494Q876.0 465 1068 515" class="edge" style="stroke:var(--pink);stroke-width:2.2"/><text x="504" y="558" font-size="12" class="accent" font-weight="600" >衰减</text><text x="558" y="558" font-size="12" class="pink" font-weight="600" >再激活</text><text x="1068" y="558" font-size="11" class="muted" font-weight="400" text-anchor="end">机制示意</text><text x="36" y="615" font-size="14" class="muted" font-weight="400" >来源范围 · 激活去重 · 网络快照 · 审核与恢复</text>
</svg>
