<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="794" viewBox="0 0 1120 794" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">十二类人物认识</title><desc id="desc">身份与生平、观念、偏好、习惯、应对倾向、价值、目标、能力、关系、情绪联结、自我认识、现实条件。每类认识保留主体、范围、时间与来源。</desc>
<style>
:root{--bg:#faf8fe;--panel:#ffffff;--soft:#f1eaf9;--line:#e5dcef;--text:#30233f;--muted:#897899;--accent:#9365cb;--pink:#bf71ac;--blue:#777bc4;--edge:#c2a8db}
@media(prefers-color-scheme:dark){:root{--bg:#120e1c;--panel:#1d162b;--soft:#2c203e;--line:#3a2b4d;--text:#f1eafa;--muted:#b5a0ca;--accent:#c39cf5;--pink:#e0a1ce;--blue:#a5acf1;--edge:#795496}}
.bg{fill:var(--bg);stroke:var(--line)}.panel{fill:var(--panel);stroke:var(--line)}.soft{fill:var(--soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.pink{fill:var(--pink)}.blue{fill:var(--blue)}.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.icon{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect x="1" y="1" width="1118" height="792" rx="22" class="bg" /><text x="36" y="36" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">PERSON UNDERSTANDING / 12 DIMENSIONS</text><text x="36" y="77" font-size="32" class="text" font-weight="600" >认识一个人，有十二个维度。</text><text x="36" y="108" font-size="16" class="muted" font-weight="400" >从一次经历，到逐渐形成的认识。</text><ellipse cx="560" cy="430" rx="193" ry="224" class="edge" stroke-opacity=".12"/><ellipse cx="560" cy="430" rx="150" ry="170" class="edge" stroke-opacity=".12"/><path d="M322 183C402 183 493.388887462645 360.8699798456862 493.388887462645 360.8699798456862" class="edge" stroke-opacity=".5"/><circle cx="493.388887462645" cy="360.8699798456862" r="3" class="accent"/><path d="M322 283C402 283 478.3233922535079 379.5526834506961 478.3233922535079 379.5526834506961" class="edge" stroke-opacity=".5"/><circle cx="478.3233922535079" cy="379.5526834506961" r="3" class="accent"/><path d="M322 383C402 383 465.8188720842259 411.4012058317589 465.8188720842259 411.4012058317589" class="edge" stroke-opacity=".5"/><circle cx="465.8188720842259" cy="411.4012058317589" r="3" class="accent"/><path d="M322 483C402 483 466.2953154277404 450.8670095896208 466.2953154277404 450.8670095896208" class="edge" stroke-opacity=".5"/><circle cx="466.2953154277404" cy="450.8670095896208" r="3" class="accent"/><path d="M322 583C402 583 479.24686636385087 481.9127287660959 479.24686636385087 481.9127287660959" class="edge" stroke-opacity=".5"/><circle cx="479.24686636385087" cy="481.9127287660959" r="3" class="accent"/><path d="M322 683C402 683 494.2222327754068 499.92342482278184 494.2222327754068 499.92342482278184" class="edge" stroke-opacity=".5"/><circle cx="494.2222327754068" cy="499.92342482278184" r="3" class="accent"/><path d="M798 183C718 183 626.611112537355 360.8699798456862 626.611112537355 360.8699798456862" class="edge" stroke-opacity=".5"/><circle cx="626.611112537355" cy="360.8699798456862" r="3" class="accent"/><path d="M798 283C718 283 641.6766077464921 379.55268345069607 641.6766077464921 379.55268345069607" class="edge" stroke-opacity=".5"/><circle cx="641.6766077464921" cy="379.55268345069607" r="3" class="accent"/><path d="M798 383C718 383 654.1811279157741 411.4012058317589 654.1811279157741 411.4012058317589" class="edge" stroke-opacity=".5"/><circle cx="654.1811279157741" cy="411.4012058317589" r="3" class="accent"/><path d="M798 483C718 483 653.7046845722597 450.86700958962086 653.7046845722597 450.86700958962086" class="edge" stroke-opacity=".5"/><circle cx="653.7046845722597" cy="450.86700958962086" r="3" class="accent"/><path d="M798 583C718 583 640.7531336361492 481.9127287660959 640.7531336361492 481.9127287660959" class="edge" stroke-opacity=".5"/><circle cx="640.7531336361492" cy="481.9127287660959" r="3" class="accent"/><path d="M798 683C718 683 625.7777672245932 499.9234248227819 625.7777672245932 499.9234248227819" class="edge" stroke-opacity=".5"/><circle cx="625.7777672245932" cy="499.9234248227819" r="3" class="accent"/><circle cx="560" cy="430" r="85" class="soft"/><circle cx="560" cy="430" r="85" class="edge" stroke-opacity=".6"/><g transform="translate(536 358) scale(2)" class="icon"><circle cx="12" cy="7" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></g><text x="560" y="456" font-size="30" class="text" font-weight="600" text-anchor="middle">主体</text><text x="560" y="535" font-size="11" class="accent" font-weight="600" text-anchor="middle" letter-spacing="2">PERSON MEMORY</text><text x="560" y="565" font-size="17" class="muted" font-weight="400" text-anchor="middle">同一个人，多类认识。</text><rect x="36" y="140" width="286" height="86" rx="13" class="panel" /><g transform="translate(52 165) scale(1)" class="icon"><circle cx="12" cy="7" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></g><text x="90" y="175" font-size="19" class="text" font-weight="600" >身份与生平</text><text x="90" y="203" font-size="14" class="muted" font-weight="400" >姓名、身份与经历</text><text x="304" y="158" font-size="9" class="muted" font-weight="500" text-anchor="end">01</text><rect x="36" y="240" width="286" height="86" rx="13" class="panel" /><g transform="translate(52 265) scale(1)" class="icon"><path d="M20 15.5a3.5 3.5 0 0 1-3.5 3.5H10l-4.5 3v-3.3A3.5 3.5 0 0 1 3 15.5v-8A3.5 3.5 0 0 1 6.5 4h10A3.5 3.5 0 0 1 20 7.5Z"/><path d="M7.5 10h8M7.5 13h5"/></g><text x="90" y="275" font-size="19" class="text" font-weight="600" >观念与看法</text><text x="90" y="303" font-size="14" class="muted" font-weight="400" >怎样理解人物与事物</text><text x="304" y="258" font-size="9" class="muted" font-weight="500" text-anchor="end">02</text><rect x="36" y="340" width="286" height="86" rx="13" class="panel" /><g transform="translate(52 365) scale(1)" class="icon"><path d="M12 20s-7.1-4.4-8.6-8.6C2.2 8.1 4.1 5.5 7.1 5.5c1.8 0 3.5.9 4.9 2.6 1.4-1.7 3.1-2.6 4.9-2.6 3 0 4.9 2.6 3.7 5.9C19.1 15.6 12 20 12 20Z"/></g><text x="90" y="375" font-size="19" class="text" font-weight="600" >喜好与厌恶</text><text x="90" y="403" font-size="14" class="muted" font-weight="400" >可选择时更愿意怎样</text><text x="304" y="358" font-size="9" class="muted" font-weight="500" text-anchor="end">03</text><rect x="36" y="440" width="286" height="86" rx="13" class="panel" /><g transform="translate(52 465) scale(1)" class="icon"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h3M8 17h5"/></g><text x="90" y="475" font-size="19" class="text" font-weight="600" >习惯与生活规律</text><text x="90" y="503" font-size="14" class="muted" font-weight="400" >什么条件下经常做什么</text><text x="304" y="458" font-size="9" class="muted" font-weight="500" text-anchor="end">04</text><rect x="36" y="540" width="286" height="86" rx="13" class="panel" /><g transform="translate(52 565) scale(1)" class="icon"><path d="M2 12h3l3-7 4 14 4-12 3 5h3"/></g><text x="90" y="575" font-size="19" class="text" font-weight="600" >气质与应对倾向</text><text x="90" y="603" font-size="14" class="muted" font-weight="400" >怎样交流、选择与应对</text><text x="304" y="558" font-size="9" class="muted" font-weight="500" text-anchor="end">05</text><rect x="36" y="640" width="286" height="86" rx="13" class="panel" /><g transform="translate(52 665) scale(1)" class="icon"><path d="M12 3v18M5 21h14M4 6h16M5 6l-3 8h6L5 6Zm14 0-3 8h6l-3-8Z"/></g><text x="90" y="675" font-size="19" class="text" font-weight="600" >价值与优先级</text><text x="90" y="703" font-size="14" class="muted" font-weight="400" >在真实取舍中保护什么</text><text x="304" y="658" font-size="9" class="muted" font-weight="500" text-anchor="end">06</text><rect x="798" y="140" width="286" height="86" rx="13" class="panel" /><g transform="translate(814 165) scale(1)" class="icon"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></g><text x="852" y="175" font-size="19" class="text" font-weight="600" >目标与未完事项</text><text x="852" y="203" font-size="14" class="muted" font-weight="400" >正在追求与尚待继续</text><text x="1066" y="158" font-size="9" class="muted" font-weight="500" text-anchor="end">07</text><rect x="798" y="240" width="286" height="86" rx="13" class="panel" /><g transform="translate(814 265) scale(1)" class="icon"><path d="m12 3 1.4 5.6L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.4Z"/><path d="m19 16 .6 2.4L22 19l-2.4.6L19 22l-.6-2.4L16 19l2.4-.6Z"/></g><text x="852" y="275" font-size="19" class="text" font-weight="600" >能力与熟练度</text><text x="852" y="303" font-size="14" class="muted" font-weight="400" >会做什么，表现如何</text><text x="1066" y="258" font-size="9" class="muted" font-weight="500" text-anchor="end">08</text><rect x="798" y="340" width="286" height="86" rx="13" class="panel" /><g transform="translate(814 365) scale(1)" class="icon"><path d="m10 14 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 10a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-1 1"/></g><text x="852" y="375" font-size="19" class="text" font-weight="600" >关系、角色与边界</text><text x="852" y="403" font-size="14" class="muted" font-weight="400" >与谁形成怎样的关系</text><text x="1066" y="358" font-size="9" class="muted" font-weight="500" text-anchor="end">09</text><rect x="798" y="440" width="286" height="86" rx="13" class="panel" /><g transform="translate(814 465) scale(1)" class="icon"><circle cx="12" cy="12" r="5"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></g><text x="852" y="475" font-size="19" class="text" font-weight="600" >情绪联结</text><text x="852" y="503" font-size="14" class="muted" font-weight="400" >什么容易引出何种感受</text><text x="1066" y="458" font-size="9" class="muted" font-weight="500" text-anchor="end">10</text><rect x="798" y="540" width="286" height="86" rx="13" class="panel" /><g transform="translate(814 565) scale(1)" class="icon"><circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5 5-3Z"/></g><text x="852" y="575" font-size="19" class="text" font-weight="600" >自我认识</text><text x="852" y="603" font-size="14" class="muted" font-weight="400" >当事人怎样理解自己</text><text x="1066" y="558" font-size="9" class="muted" font-weight="500" text-anchor="end">11</text><rect x="798" y="640" width="286" height="86" rx="13" class="panel" /><g transform="translate(814 665) scale(1)" class="icon"><path d="m3 10 9-7 9 7v11H3V10Z"/><path d="M9 21v-8h6v8"/></g><text x="852" y="675" font-size="19" class="text" font-weight="600" >现实条件与约束</text><text x="852" y="703" font-size="14" class="muted" font-weight="400" >什么正在影响当前行为</text><text x="1066" y="658" font-size="9" class="muted" font-weight="500" text-anchor="end">12</text><text x="36" y="770" font-size="14" class="accent" font-weight="500" >主体 · 适用范围 · 时间 · 来源证据</text>
</svg>
