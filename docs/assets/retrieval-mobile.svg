y="414" font-size="10" class="accent" font-weight="600" >ENTITY</text><text x="86" y="439" font-size="20" class="text" font-weight="600" >实体匹配</text><text x="86" y="461" font-size="12" class="muted" font-weight="400" >人物、地点与事物的名称和别名</text><path d="M12 525h12M456 525h12" class="edge" /><rect x="24" y="486" width="432" height="78" rx="13" class="panel" /><g transform="translate(41 513) scale(0.95)" class="icon"><path d="M3 19 9 8l5 7 7-12M3 19h18"/><circle cx="9" cy="8" r="2"/><circle cx="14" cy="15" r="2"/></g><text x="86" y="504" font-size="10" class="accent" font-weight="600" >VECTOR · 可选</text><text x="86" y="529" font-size="20" class="text" font-weight="600" >语义检索</text><text x="86" y="551" font-size="12" class="muted" font-weight="400" >提供 Embedding Provider 时参与</text><rect x="24" y="600" width="432" height="78" rx="14" class="soft" /><text x="44" y="632" font-size="21" class="text" font-weight="600" >门控与分数融合</text><text x="44" y="658" font-size="15" class="muted" font-weight="400" >人物归属 · 状态 · 有效来源范围</text><path d="M240 678v19m-4-4 4 4 4-4" class="edge" /><rect x="24" y="710" width="432" height="78" rx="14" class="panel" /><text x="44" y="742" font-size="21" class="text" font-weight="600" >关系与证据展开</text><text x="44" y="768" font-size="15" class="muted" font-weight="400" >事件上下文 · 当前认识 · 原话与证据</text><path d="M240 788v18m-4-4 4 4 4-4" class="edge" /><rect x="24" y="820" width="432" height="62" rx="14" class="soft" /><text x="44" y="859" font-size="19" class="accent" font-weight="600" >按意图与预算返回有界上下文</text><text x="28" y="936" font-size="14" class="muted" font-weight="400" >时间查询与有效记忆锚点使用相应分支。</text>
