<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">多路检索与证据展开</title><desc id="desc">普通查询组合词法、BM25、实体和可选向量线索。候选受主体、状态和来源约束，沿关系展开证据后返回有界上下文。时间查询与有效锚点使用相应分支。</desc>
<style>
:root{--bg:#faf8fe;--panel:#ffffff;--soft:#f1eaf9;--line:#e5dcef;--text:#30233f;--muted:#897899;--accent:#9365cb;--pink:#bf71ac;--blue:#777bc4;--edge:#c2a8db}
@media(prefers-color-scheme:dark){:root{--bg:#120e1c;--panel:#1d162b;--soft:#2c203e;--line:#3a2b4d;--text:#f1eafa;--muted:#b5a0ca;--accent:#c39cf5;--pink:#e0a1ce;--blue:#a5acf1;--edge:#795496}}
.bg{fill:var(--bg);stroke:var(--line)}.panel{fill:var(--panel);stroke:var(--line)}.soft{fill:var(--soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.pink{fill:var(--pink)}.blue{fill:var(--blue)}.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.icon{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect x="1" y="1" width="1118" height="618" rx="22" class="bg" /><text x="36" y="36" font-size="11" class="muted" font-weight="600" letter-spacing="2.2">RETRIEVAL / MULTIPLE SIGNALS</text><text x="36" y="77" font-size="32" class="text" font-weight="600" >一次查询，多条线索。</text><text x="36" y="108" font-size="16" class="muted" font-weight="400" >找到记忆，再沿关系展开证据。</text><rect x="36" y="277" width="170" height="94" rx="16" class="soft" /><g transform="translate(57 298) scale(1)" class="icon"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6M7 10h6"/></g><text x="94" y="321" font-size="23" class="text" font-weight="600" >当前查询</text><text x="56" y="351" font-size="14" class="muted" font-weight="400" >话题 · 人物 · 条件</text><path d="M206 324H240V187H277" class="edge" /><rect x="278" y="148" width="330" height="78" rx="13" class="panel" /><g transform="translate(295 174) scale(1)" class="icon"><rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M9 7h6m-6 5h6m-6 5h4"/></g><text x="334" y="173" font-size="10" class="accent" font-weight="600" >LEXICAL</text><text x="334" y="199" font-size="20" class="text" font-weight="600" >词法匹配</text><text x="466" y="199" font-size="13" class="muted" font-weight="400" >短语</text><path d="M608 187H649V259H691" class="edge" /><path d="M206 324H240V281H277" class="edge" /><rect x="278" y="242" width="330" height="78" rx="13" class="panel" /><g transform="translate(295 268) scale(1)" class="icon"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6M7 10h6"/></g><text x="334" y="267" font-size="10" class="accent" font-weight="600" >BM25</text><text x="334" y="293" font-size="20" class="text" font-weight="600" >全文检索</text><text x="466" y="293" font-size="13" class="muted" font-weight="400" >关键词</text><path d="M608 281H649V259H691" class="edge" /><path d="M206 324H240V375H277" class="edge" /><rect x="278" y="336" width="330" height="78" rx="13" class="panel" /><g transform="translate(295 362) scale(1)" class="icon"><circle cx="12" cy="7" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></g><text x="334" y="361" font-size="10" class="accent" font-weight="600" >ENTITY</text><text x="334" y="387" font-size="20" class="text" font-weight="600" >实体匹配</text><text x="466" y="387" font-size="13" class="muted" font-weight="400" >名称 / 别名</text><path d="M608 375H649V259H691" class="edge" /><path d="M206 324H240V469H277" class="edge" /><rect x="278" y="430" width="330" height="78" rx="13" class="panel" /><g transform="translate(295 456) scale(1)" class="icon"><path d="M3 19 9 8l5 7 7-12M3 19h18"/><circle cx="9" cy="8" r="2"/><circle cx="14" cy="15" r="2"/></g><text x="334" y="455" font-size="10" class="accent" font-weight="600" >VECTOR · 可选</text><text x="334" y="481" font-size="20" class="text" font-weight="600" >语义检索</text><text x="466" y="481" font-size="13" class="muted" font-weight="400" >可选</text><path d="M608 469H649V259H691" class="edge" /><rect x="692" y="209" width="176" height="100" rx="16" class="soft" /><text x="714" y="250" font-size="22" class="text" font-weight="600" >门控与融合</text><text x="714" y="278" font-size="13" class="muted" font-weight="400" >主体 · 状态 · 来源</text><path d="M780 309v35m-5-5 5 5 5-5" class="edge" /><rect x="692" y="354" width="176" height="100" rx="16" class="panel" /><text x="714" y="396" font-size="22" class="text" font-weight="600" >关系与证据</text><text x="714" y="425" font-size="13" class="muted" font-weight="400" >关联展开 · 原话核对</text><path d="M868 404H888V324H907" class="edge" /><rect x="908" y="277" width="176" height="94" rx="16" class="soft" /><text x="930" y="319" font-size="22" class="accent" font-weight="600" >有界上下文</text><text x="930" y="348" font-size="13" class="muted" font-weight="400" >按意图与预算组织</text><rect x="36" y="538" width="1048" height="48" rx="12" class="soft" /><text x="55" y="568" font-size="15" class="accent" font-weight="600" >时间分支</text><text x="139" y="568" font-size="14" class="muted" font-weight="400" >按可识别时间条件检索</text><text x="442" y="568" font-size="15" class="accent" font-weight="600" >锚点续查</text><text x="526" y="568" font-size="14" class="muted" font-weight="400" >围绕已有的有效记忆继续展开</text><text x="833" y="568" font-size="13" class="muted" font-weight="400" >向量路线按配置启用</text>
</svg>
