<svg xmlns="http://www.w3.org/2000/svg" width="480" height="594" viewBox="0 0 480 594" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">LoCoMo 作答输入与对话长度</title><desc id="desc">10 组对话的长度从 52,707 到 106,835 字符。完整对话组每题输入从 12,990 增至 24,533 token，与长度的相关系数为 0.99；Suzu Memory 每题输入保持在 4,033–4,664 token，相关系数为 0.09。</desc>
<style>
:root{--bg:#faf8fe;--panel:#ffffff;--soft:#f1eaf9;--line:#e5dcef;--text:#30233f;--muted:#897899;--accent:#9365cb;--pink:#bf71ac;--blue:#777bc4;--edge:#c2a8db;--track:#efe8f7;--none:#cdbfdc}
@media(prefers-color-scheme:dark){:root{--bg:#120e1c;--panel:#1d162b;--soft:#2c203e;--line:#3a2b4d;--text:#f1eafa;--muted:#b5a0ca;--accent:#c39cf5;--pink:#e0a1ce;--blue:#a5acf1;--edge:#795496;--track:#261c36;--none:#6d5a85}}
.bg{fill:var(--bg);stroke:var(--line)}.panel{fill:var(--panel);stroke:var(--line)}.soft{fill:var(--soft)}.track{fill:var(--track)}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.none{fill:var(--none)}
.dash{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--accent)}
.rule{stroke:var(--line);stroke-width:1}.trend-full{stroke:var(--blue);stroke-width:2;stroke-dasharray:6 5;opacity:.7}.band{fill:var(--accent);fill-opacity:.14}.pt-full{fill:var(--blue)}.pt-memory{fill:var(--accent);stroke:var(--bg);stroke-width:1.5}
.num{font-variant-numeric:tabular-nums}.s1{stop-color:var(--accent)}.s2{stop-color:var(--pink)}
</style>
<defs><linearGradient id="bar" x1="0" x2="1"><stop class="s1"/><stop offset="1" class="s2"/></linearGradient></defs>
<rect x="1" y="1" width="478" height="592" rx="22" class="bg"/><text x="28" y="36" font-size="10" class="muted" font-weight="600" letter-spacing="1.2">INPUT VS. DIALOGUE LENGTH · 10 CONVERSATIONS</text><text x="28" y="72" font-size="23" class="text" font-weight="600">对话变长，</text><text x="28" y="104" font-size="23" class="text" font-weight="600">记忆组的输入不跟着涨。</text><text x="28" y="132" font-size="13" class="muted">每个点是一组对话，纵轴为每题平均作答输入。</text><path d="M70 470H452" class="rule"/><text x="60" y="474" font-size="11" class="muted num" text-anchor="end">0</text><path d="M70 420H452" class="dash"/><text x="60" y="424" font-size="11" class="muted num" text-anchor="end">5K</text><path d="M70 370H452" class="dash"/><text x="60" y="374" font-size="11" class="muted num" text-anchor="end">10K</text><path d="M70 320H452" class="dash"/><text x="60" y="324" font-size="11" class="muted num" text-anchor="end">15K</text><path d="M70 270H452" class="dash"/><text x="60" y="274" font-size="11" class="muted num" text-anchor="end">20K</text><path d="M70 220H452" class="dash"/><text x="60" y="224" font-size="11" class="muted num" text-anchor="end">25K</text><path d="M70 170H452" class="dash"/><text x="60" y="174" font-size="11" class="muted num" text-anchor="end">30K</text><text x="70" y="490" font-size="11" class="muted num" text-anchor="middle">40K</text><text x="165.5" y="490" font-size="11" class="muted num" text-anchor="middle">60K</text><text x="261" y="490" font-size="11" class="muted num" text-anchor="middle">80K</text><text x="356.5" y="490" font-size="11" class="muted num" text-anchor="middle">100K</text><text x="452" y="490" font-size="11" class="muted num" text-anchor="middle">120K</text><text x="261" y="512" font-size="11.5" class="muted" text-anchor="middle">对话长度（字符）</text><path d="M111.6 347.6L408.2 210.0" class="trend-full"/><rect x="111.6" y="423.4" width="296.7" height="6.3" rx="4" class="band"/><circle cx="130.7" cy="340.1" r="5" class="pt-full"/><circle cx="225.7" cy="300.2" r="5" class="pt-full"/><circle cx="233.9" cy="287.9" r="5" class="pt-full"/><circle cx="298.3" cy="256.2" r="5" class="pt-full"/><circle cx="320.8" cy="246.4" r="5" class="pt-full"/><circle cx="338.1" cy="244.1" r="5" class="pt-full"/><circle cx="341.9" cy="239.7" r="5" class="pt-full"/><circle cx="358.7" cy="228.9" r="5" class="pt-full"/><circle cx="383.7" cy="224.2" r="5" class="pt-full"/><circle cx="389.1" cy="224.7" r="5" class="pt-full"/><circle cx="130.7" cy="429.0" r="5" class="pt-memory"/><circle cx="225.7" cy="426.8" r="5" class="pt-memory"/><circle cx="233.9" cy="424.6" r="5" class="pt-memory"/><circle cx="298.3" cy="423.4" r="5" class="pt-memory"/><circle cx="320.8" cy="426.4" r="5" class="pt-memory"/><circle cx="338.1" cy="427.3" r="5" class="pt-memory"/><circle cx="341.9" cy="426.3" r="5" class="pt-memory"/><circle cx="358.7" cy="423.4" r="5" class="pt-memory"/><circle cx="383.7" cy="427.1" r="5" class="pt-memory"/><circle cx="389.1" cy="429.7" r="5" class="pt-memory"/><text x="124.675925" y="328.10333333333335" font-size="11.5" class="blue num" text-anchor="middle" font-weight="600">12,990</text><text x="389.137125" y="210.66980263157893" font-size="11.5" class="blue num" text-anchor="middle" font-weight="600">24,533</text><text x="111.575925" y="413.36341463414635" font-size="11.5" class="accent num" font-weight="600">Suzu Memory 4,033–4,664</text><text x="251.45" y="268.73850335160836" font-size="11.5" class="blue" text-anchor="end" font-weight="600">完整对话</text><text x="28" y="544" font-size="12" class="muted">记忆组每次检索最多返回 10 条记忆、10,976 字符，</text><text x="28" y="564" font-size="12" class="muted">每题最多检索 6 次；单题输入取决于检索次数。</text>
</svg>
